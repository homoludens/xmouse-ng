import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// F-Droid's source build is an explicit APK-only mode. Parse it before even
// materializing maintainer signing providers; invalid values never fall back.
def fdroidUnsignedValue = providers.gradleProperty('fdroidUnsigned').orNull
if (fdroidUnsignedValue != null && !(fdroidUnsignedValue in ['true', 'false'])) {
    throw new GradleException('fdroidUnsigned must be exactly true or false.')
}
def fdroidUnsigned = fdroidUnsignedValue == 'true'

// Values belong in the owner's external Gradle user properties, never this repo.
// Do not load any of them for a source-only unsigned reproduction.
def releaseSigningProperties = fdroidUnsigned ? [:] : [
    'RELEASE_STORE_FILE', 'RELEASE_KEY_ALIAS', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_PASSWORD'
].collectEntries { name -> [name, providers.gradleProperty(name).orNull] }
def externalReleaseStore = fdroidUnsigned || !releaseSigningProperties.RELEASE_STORE_FILE?.trim() ?
    null : file(releaseSigningProperties.RELEASE_STORE_FILE)

if (fdroidUnsigned) {
    // Keep artifacts out of the ordinary app/build/outputs tree.
    layout.buildDirectory.set(layout.projectDirectory.dir('build/fdroid-unsigned'))
}

def verifyLocalReleaseSigning = tasks.register('verifyLocalReleaseSigning') {
    group = 'verification'
    description = 'Require complete external signing configuration before release packaging.'
    // Do not serialize local signing credentials into a configuration-cache entry.
    notCompatibleWithConfigurationCache('Release signing uses private local Gradle properties.')
    doLast {
        if (!fdroidUnsigned && releaseSigningProperties.values().any { it == null || it.trim().isEmpty() }) {
            throw new GradleException('Release signing requires all four external RELEASE_* Gradle properties. No unsigned or debug-key fallback is allowed.')
        }
        if (!fdroidUnsigned && (!externalReleaseStore.isFile() ||
                externalReleaseStore.canonicalFile.toPath().startsWith(rootDir.canonicalFile.toPath()))) {
            throw new GradleException('Release signing requires an existing keystore outside the source repository.')
        }
    }
}

android {
    packaging {
        resources.merges += 'META-INF/LICENSE.md'
        // dnsjava is a codec here, never a process-wide InetAddress service provider.
        // AGP's default service wildcard MERGE takes precedence over EXCLUDE. Preserve
        // the app's existing crypto/coroutine service merges without merging DNS SPIs.
        resources.merges -= '/META-INF/services/**'
        resources.merges += [
            '/META-INF/services/java.security.Provider',
            '/META-INF/services/kotlinx.coroutines.CoroutineExceptionHandler',
            '/META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory'
        ]
        resources.excludes += [
            '/META-INF/services/java.net.spi.InetAddressResolverProvider',
            '/META-INF/services/sun.net.spi.nameservice.NameServiceDescriptor'
        ]
    }
    lint {
        abortOnError = true
        checkTestSources = true
        xmlReport = true
    }

    namespace = 'net.droopia.xmouse_ng'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "net.droopia.xmouse_ng"
        minSdk = 26
        targetSdk = 37
        versionCode 28
        versionName "2.1.2"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (!fdroidUnsigned) {
            release {
                storeFile = externalReleaseStore
                keyAlias = releaseSigningProperties.RELEASE_KEY_ALIAS
                storePassword = releaseSigningProperties.RELEASE_STORE_PASSWORD
                keyPassword = releaseSigningProperties.RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig = fdroidUnsigned ? null : signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    sourceSets {
        test.kotlin.srcDir 'src/testFixtures/java'
        androidTest.kotlin.srcDir 'src/testFixtures/java'
        test.resources.srcDir 'src/androidTest/assets'
    }
}

// AGP can omit validateSigningRelease when the signing config is incomplete.
// Gate the release build and packaging too, so that cannot yield an unsigned APK.
// Debug/test builds remain usable without the private key.
tasks.matching {
    it.name in ['preReleaseBuild', 'validateSigningRelease', 'packageRelease', 'packageReleaseBundle']
}.configureEach {
    dependsOn verifyLocalReleaseSigning
    if (fdroidUnsigned && name == 'packageReleaseBundle') {
        doFirst {
            throw new GradleException('fdroidUnsigned=true supports release APKs only; AAB packaging is disabled.')
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

configurations {
    mockitoAgent
}

// Explicit startup instrumentation avoids Mockito's dynamic self-attachment on JDK 21+.
abstract class MockitoAgentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getAgentJar()

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agentJar.asPath}".toString()]
    }
}

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
        agentJar.from(configurations.mockitoAgent)
    })
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Provide the Android platform org.json API's implementation to local JVM tests.
    testImplementation 'org.json:json:20180813'
    // JVM-only isolated loopback SSH server; never included in app/instrumentation APKs.
    testImplementation 'org.apache.sshd:sshd-core:2.20.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
    testImplementation 'com.tngtech.java:junit-dataprovider:1.13.1'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'com.github.mwiede:jsch:2.28.8'
    // Codec only: no dnsjava resolver/cache, DNS-SD, or background network work.
    implementation 'dnsjava:dnsjava:3.6.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.13.0'

    // Compose is for the new editor; existing control screens remain Views.
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2026.02.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
