import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    packaging {
        resources.merges += 'META-INF/LICENSE.md'
    }
    lint {
        abortOnError = true
        checkTestSources = true
        xmlReport = true
    }

    namespace = 'com.stripe1.xmouse'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "com.stripe1.xmouse"
        minSdk = 26
        targetSdk = 37
        versionCode 25
        versionName "2.0.27"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
    sourceSets {
        test.kotlin.srcDir 'src/testFixtures/java'
        androidTest.kotlin.srcDir 'src/testFixtures/java'
        test.resources.srcDir 'src/androidTest/assets'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

configurations {
    mockitoAgent
}

// Explicit startup instrumentation avoids Mockito's dynamic self-attachment on JDK 21+.
abstract class MockitoAgentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getAgentJar()

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agentJar.asPath}".toString()]
    }
}

tasks.withType(Test).configureEach {
    jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
        agentJar.from(configurations.mockitoAgent)
    })
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
    testImplementation 'com.tngtech.java:junit-dataprovider:1.13.1'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
